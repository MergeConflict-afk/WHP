<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <script>
        // 前端合法性校验
        function checkForm(){
            let username = document.getElementById("username").value.trim();
            let pwd = document.getElementById("pwd").value.trim();
            if(username === ""){
                alert("用户名不能为空");
                return false;
            }
            if(pwd === ""){
                alert("密码不能为空");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <h3>用户注册</h3>
    <form action="register.jsp" method="post" onsubmit="return checkForm()">
        用户名：<input type="text" name="username" id="username"><br><br>
        密&nbsp;&nbsp;&nbsp;码：<input type="password" name="pwd" id="pwd"><br><br>
        邮&nbsp;&nbsp;&nbsp;箱：<input type="text" name="email"><br><br>
        <input type="submit" value="提交注册">
    </form>
</body>
</html>
