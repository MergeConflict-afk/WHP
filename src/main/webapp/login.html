<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <!-- 引入外部css -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-box">
        <h2>系统登录</h2>
        <div class="item">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="item">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button id="loginBtn">登录</button>
        <a href="register.html" class="register-link">没有账户？注册一个</a>
    </div>
    <!-- 放页面底部引入js，DOM加载完成后再执行，避免获取元素失败 -->
    <script src="js/login.js"></script>
</body>
</html>
